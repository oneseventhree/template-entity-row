<svg xmlns="http://www.w3.org/2000/svg" width="940" height="130" viewBox="0 0 940 130" role="img" aria-labelledby="title desc">
  <title id="title">Fictional native weather row</title>
  <desc id="desc">A mock entity row for a demo home with layered cloud artwork.</desc>
  <rect width="940" height="130" fill="#191919"/>
  <g transform="translate(28 26)">
    <circle cx="38" cy="33" r="25" fill="#cfcfcf"/>
    <circle cx="65" cy="39" r="22" fill="#d8d8d8"/>
    <circle cx="22" cy="47" r="18" fill="#eeeeee"/>
    <rect x="20" y="38" width="64" height="29" rx="15" fill="#eeeeee"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="130" y="50" fill="#eeeeee" font-size="29">Demo Home: Cloudy</text>
    <text x="130" y="92" fill="#9e9e9e" font-size="25">High: 21 °C | Low: 13 °C | Humidity: 58%</text>
    <text x="855" y="66" fill="#eeeeee" font-size="27" text-anchor="end">18 °C</text>
  </g>
</svg>

